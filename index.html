<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner Algorithm Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #2d2d2d;
            border: 2px solid #444;
            margin-top: 20px;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            margin: 5px;
        }
        button:hover { background-color: #005999; }
        #status { font-size: 18px; margin-top: 10px; color: #bbb; }
    </style>
</head>
<body>

    <h1>Linear Search Visualizer</h1>
    <button onclick="startSimulation()">Start Search</button>
    <button onclick="generateNewArray()">Reset Array</button>
    <div id="status">Click "Start Search" to begin!</div>

    <!-- The screen where we draw the array blocks -->
    <canvas id="simCanvas" width="800" height="200"></canvas>

    <script src="script.js"></script>
</body>
</html>
